version: "3.8"

services:
  # 1. PostgreSQL tích hợp sẵn pgvector cho Hybrid Search
  postgres:
    image: pgvector/pgvector:pg15
    container_name: nexusticket_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: nexusticket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexusticket"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. PgBouncer (Connection Pooling chống cạn kiệt connection khi stress test K6)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: nexusticket_pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://postgres:password123@postgres:5432/nexusticket"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: plain
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Redis (Dùng cho Distributed Lock giữ ghế, Cache đa tầng & BullMQ)
  redis:
    image: redis:7-alpine
    container_name: nexusticket_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. AI Pricing Service (Dành cho bạn làm AI đóng gói model DQN / Time-Series)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: nexusticket_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./ai-service:/app
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
